name: Capstone CI

# Skeleton CI pipeline for Track A. The lint/build/test job is wired and
# should run as-is once this file is dropped into your repo's
# `.github/workflows/`. The headless Claude Code review job is a TODO —
# CAPSTONE.md deliverable 4 requires it to run in headless mode
# (`claude -p ...`) and fail the build on a critical finding; that
# behaviour is not implemented here.

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  headless-claude-review:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # TODO (deliverable 4): run Claude Code in headless mode against
      # this diff and fail the job on a critical finding.
